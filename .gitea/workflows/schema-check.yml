name: gitea-schema-check

on:
  push:
    paths:
      - 'dashboard/**'
      - 'schemas/**'
      - '.gitea/workflows/**'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'schemas/**'
      - '.gitea/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: dappgo-ci
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON schemas
        run: |
          set -Eeuo pipefail
          # jsonschema is pinned per run on the dappgo-ci image; nothing is
          # kept in the production account's tools directory.
          uv run --no-project --python /usr/bin/python3.12 \
            --with 'jsonschema==4.25.1' python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path

          root = Path.cwd()
          data_path = root / "dashboard/data.json"
          if data_path.exists():
              schema = json.loads((root / "schemas/data.schema.json").read_text())
              data = json.loads(data_path.read_text())
              errors = list(Draft202012Validator(schema).iter_errors(data))
              if errors:
                  raise SystemExit("; ".join(error.message for error in errors[:20]))
              print("ok: dashboard/data.json")
          else:
              print("skip: dashboard/data.json")
          PY
